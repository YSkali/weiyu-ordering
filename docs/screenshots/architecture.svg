<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9"/>
      <stop offset="100%" style="stop-color:#C8E6C9"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD"/>
      <stop offset="100%" style="stop-color:#BBDEFB"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0"/>
      <stop offset="100%" style="stop-color:#FFE0B2"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="600" fill="#FAFAFA" rx="10"/>

  <!-- 客户端层 -->
  <rect x="30" y="30" width="840" height="160" rx="10" fill="url(#clientGrad)" stroke="#4CAF50" stroke-width="2"/>
  <text x="60" y="60" font-size="16" font-weight="bold" fill="#2E7D32">客户端层 (uni-app H5)</text>

  <!-- 客户端模块 -->
  <rect x="60" y="80" width="220" height="90" rx="8" fill="white" stroke="#66BB6A"/>
  <text x="170" y="110" font-size="14" text-anchor="middle" fill="#333">顾客端</text>
  <text x="170" y="135" font-size="11" text-anchor="middle" fill="#666">登录 / 首页 / 购物车</text>
  <text x="170" y="155" font-size="11" text-anchor="middle" fill="#666">下单 / 积分兑换 / 签到</text>

  <rect x="340" y="80" width="220" height="90" rx="8" fill="white" stroke="#66BB6A"/>
  <text x="450" y="110" font-size="14" text-anchor="middle" fill="#333">管理员端</text>
  <text x="450" y="135" font-size="11" text-anchor="middle" fill="#666">订单 / 菜品 / 用户管理</text>
  <text x="450" y="155" font-size="11" text-anchor="middle" fill="#666">积分调整 / 奖励 / 兑换审核</text>

  <rect x="620" y="80" width="220" height="90" rx="8" fill="white" stroke="#66BB6A"/>
  <text x="730" y="110" font-size="14" text-anchor="middle" fill="#333">公共服务</text>
  <text x="730" y="135" font-size="11" text-anchor="middle" fill="#666">JWT 认证 / 权限守卫</text>
  <text x="730" y="155" font-size="11" text-anchor="middle" fill="#666">WebSocket 实时通知</text>

  <!-- 连接线 -->
  <line x1="450" y1="190" x2="450" y2="220" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 服务端层 -->
  <rect x="30" y="220" width="840" height="180" rx="10" fill="url(#serverGrad)" stroke="#2196F3" stroke-width="2"/>
  <text x="60" y="250" font-size="16" font-weight="bold" fill="#1565C0">服务端层 (NestJS 10)</text>

  <!-- 服务端模块 -->
  <rect x="60" y="270" width="120" height="110" rx="8" fill="white" stroke="#64B5F6"/>
  <text x="120" y="295" font-size="13" text-anchor="middle" fill="#333">Auth</text>
  <text x="120" y="315" font-size="10" text-anchor="middle" fill="#666">登录注册</text>
  <text x="120" y="335" font-size="10" text-anchor="middle" fill="#666">JWT 签发</text>

  <rect x="210" y="270" width="120" height="110" rx="8" fill="white" stroke="#64B5F6"/>
  <text x="270" y="295" font-size="13" text-anchor="middle" fill="#333">Dish</text>
  <text x="270" y="315" font-size="10" text-anchor="middle" fill="#666">菜品 CRUD</text>
  <text x="270" y="335" font-size="10" text-anchor="middle" fill="#666">分类 / 上下架</text>

  <rect x="360" y="270" width="120" height="110" rx="8" fill="white" stroke="#64B5F6"/>
  <text x="420" y="295" font-size="13" text-anchor="middle" fill="#333">Order</text>
  <text x="420" y="315" font-size="10" text-anchor="middle" fill="#666">订单流转</text>
  <text x="420" y="335" font-size="10" text-anchor="middle" fill="#666">接单/完成</text>

  <rect x="510" y="270" width="120" height="110" rx="8" fill="white" stroke="#64B5F6"/>
  <text x="570" y="295" font-size="13" text-anchor="middle" fill="#333">User</text>
  <text x="570" y="315" font-size="10" text-anchor="middle" fill="#666">用户管理</text>
  <text x="570" y="335" font-size="10" text-anchor="middle" fill="#666">积分调整</text>

  <rect x="660" y="270" width="150" height="110" rx="8" fill="white" stroke="#64B5F6"/>
  <text x="735" y="295" font-size="13" text-anchor="middle" fill="#333">Exchange</text>
  <text x="735" y="315" font-size="10" text-anchor="middle" fill="#666">奖励管理</text>
  <text x="735" y="335" font-size="10" text-anchor="middle" fill="#666">积分兑换审核</text>

  <!-- 连接线 -->
  <line x1="450" y1="400" x2="450" y2="430" stroke="#999" stroke-width="2"/>

  <!-- 数据库层 -->
  <rect x="30" y="430" width="840" height="140" rx="10" fill="url(#dbGrad)" stroke="#FF9800" stroke-width="2"/>
  <text x="60" y="460" font-size="16" font-weight="bold" fill="#E65100">数据库层 (MySQL 8.0)</text>

  <!-- 数据库表 -->
  <rect x="60" y="480" width="100" height="70" rx="6" fill="white" stroke="#FFB74D"/>
  <text x="110" y="505" font-size="11" text-anchor="middle" fill="#333">user</text>
  <text x="110" y="525" font-size="9" text-anchor="middle" fill="#666">用户表</text>

  <rect x="180" y="480" width="100" height="70" rx="6" fill="white" stroke="#FFB74D"/>
  <text x="230" y="505" font-size="11" text-anchor="middle" fill="#333">dish</text>
  <text x="230" y="525" font-size="9" text-anchor="middle" fill="#666">菜品表</text>

  <rect x="300" y="480" width="100" height="70" rx="6" fill="white" stroke="#FFB74D"/>
  <text x="350" y="505" font-size="11" text-anchor="middle" fill="#333">order</text>
  <text x="350" y="525" font-size="9" text-anchor="middle" fill="#666">订单表</text>

  <rect x="420" y="480" width="100" height="70" rx="6" fill="white" stroke="#FFB74D"/>
  <text x="470" y="505" font-size="11" text-anchor="middle" fill="#333">order_item</text>
  <text x="470" y="525" font-size="9" text-anchor="middle" fill="#666">订单项表</text>

  <rect x="540" y="480" width="100" height="70" rx="6" fill="white" stroke="#FFB74D"/>
  <text x="590" y="505" font-size="11" text-anchor="middle" fill="#333">points_flow</text>
  <text x="590" y="525" font-size="9" text-anchor="middle" fill="#666">积分流水</text>

  <rect x="660" y="480" width="160" height="70" rx="6" fill="white" stroke="#FFB74D"/>
  <text x="740" y="505" font-size="11" text-anchor="middle" fill="#333">exchange_reward</text>
  <text x="740" y="525" font-size="9" text-anchor="middle" fill="#666">兑换奖励表</text>
</svg>
